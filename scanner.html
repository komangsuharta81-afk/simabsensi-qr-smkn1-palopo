<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner – SIABSEN QR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="scanner-page">
<div class="container-fluid py-3">
<div class="d-flex justify-content-between align-items-center mb-3">
  <div><h4 class="mb-0">SCAN QR SISWA</h4><small id="scannerUser"></small></div>
  <button class="btn btn-outline-secondary" onclick="location.href='index.html'"><i class="bi bi-arrow-left"></i> Kembali</button>
</div>
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="card shadow-lg border-0">
<div class="card-body p-3">
<div id="reader"></div>
<div class="text-center text-muted small mt-2">Posisikan QR Code di dalam kotak.</div>
<div id="scanResult" class="mt-3"></div>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script>
<script>
const u=Auth.current(); if(!u){location.href='index.html';}
document.getElementById('scannerUser').textContent=u?u.nama+' • '+u.role:'';
let busy=false, scanner;
async function onScan(decodedText){
  if(busy) return; busy=true;
  try {
    const r=await API.post('scanQR',{token:Auth.token(),token_qr:decodedText});
    if(!r.ok) throw new Error(r.message);
    const d=r.data;
    const a=d.attendance;
    document.getElementById('scanResult').innerHTML =
      '<div class="alert '+(d.duplicate?'alert-warning':'alert-success')+' text-center">'+
      '<h5>'+ (d.duplicate?'⚠️ SISWA SUDAH ABSEN':'✅ ABSENSI BERHASIL') +'</h5>'+
      '<strong>'+escapeHtml(d.student.nama)+'</strong><br>'+
      escapeHtml(d.student.kelas)+'<br>'+escapeHtml(a.jam)+'<br>'+
      '<span class="badge text-bg-'+(a.status==='HADIR'?'success':a.status==='TERLAMBAT'?'warning':'secondary')+'">'+escapeHtml(a.status)+'</span></div>';
    if(!d.duplicate) successBeep();
  } catch(e) {
    document.getElementById('scanResult').innerHTML='<div class="alert alert-danger text-center">⛔ '+escapeHtml(e.message)+'</div>';
    errorBeep();
  } finally { setTimeout(()=>busy=false,1200); }
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function successBeep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12);}catch(_){}}
function errorBeep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=220;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2);}catch(_){}}
(async()=>{try{
  const chk=await API.get('checkPiket');
  if(!chk.ok || !chk.data.isPiket){Swal.fire('Akses ditolak','Anda tidak memiliki jadwal piket hari ini.','error').then(()=>location.href='index.html');return;}
  scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:260,height:260},rememberLastUsedCamera:true},false);
  scanner.render(onScan,()=>{});
}catch(e){document.getElementById('scanResult').innerHTML='<div class="alert alert-danger">'+e.message+'</div>';}})();
</script>
</body>
</html>
